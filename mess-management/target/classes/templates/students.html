<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Students')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>



<style>
body{
    background-image: url('/images/background1.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}
</style>


<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="page-title">Students</h2>
        <a href="/students/new" class="btn btn-success btn-sm">+ Add student</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/students}">
        <div class="col-auto">
            <input type="text" name="name" class="form-control" placeholder="Search by name" th:value="${nameFilter}"/>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-secondary">Search</button>
            <button type="submit" class="btn btn-secondary">Reset</button>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(students)}" class="alert alert-light border">
        No students found.
    </div>

    <div class="table-responsive" th:if="${!#lists.isEmpty(students)}">
        <table class="table table-bordered bg-white align-middle">
            <thead class="table-light">
            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${students}">
                <td th:text="${s.name}">Name</td>
                <td th:text="${s.phone != null and !s.phone.isBlank()} ? ${s.phone} : '-'">-</td>
                <td th:text="${s.email != null and !s.email.isBlank()} ? ${s.email} : '-'">-</td>
                <td>
                    <a th:href="@{/payments/new/{id}(id=${s.id})}" class="btn btn-sm btn-outline-primary">Add payment</a>
                    <a th:href="@{/students/{id}/history(id=${s.id})}" class="btn btn-sm btn-outline-secondary">History</a>
                    <a th:href="@{/students/edit/{id}(id=${s.id})}" class="btn btn-sm btn-outline-dark">Edit</a>
                    <form th:action="@{/students/delete/{id}(id=${s.id})}" method="post" style="display:inline"
                          onsubmit="return confirm('Remove this student from the list? Their payment history will be kept in the database.');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
