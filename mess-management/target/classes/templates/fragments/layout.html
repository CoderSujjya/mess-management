<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="pageHead(title)">
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title th:text="${title} + ' | MAZI SANTUSHTI'">MAZI SANTUSHTI</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link href="/css/custom.css" rel="stylesheet"/>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    </th:block>
</head>
<body>
    <nav th:fragment="nav" class="navbar navbar-expand-md navbar-dark mess-navbar mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <img th:if="${@logoService.hasLogo()}"
                     th:src="@{'/uploads/' + ${@logoService.getCurrentLogoFilename()}}"
                     alt="Mess logo" class="mess-logo-img"/>
                <span>MAZI SANTUSHTI</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMain">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/students">Students</a></li>
                    <li class="nav-item"><a class="nav-link" href="/students/new">Add student</a></li>
                    <!--
                    <li class="nav-item"><a class="nav-link" href="/settings">Settings</a></li>
                    -->
                </ul>
            </div>
        </div>
    </nav>
</body>
</html>
