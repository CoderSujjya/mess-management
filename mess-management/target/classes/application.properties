# ==============================
# Server
# ==============================
server.port=2323

# ==============================
# MySQL datasource
# Create the database first:  CREATE DATABASE mess_management;
# Then update username/password below to match your MySQL setup.
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/mess_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=ppppp
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate
# ddl-auto=update creates/updates tables automatically from the
# entities on startup, so no manual schema.sql is required.
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# Thymeleaf
# Disable caching in development so template edits show up without
# a restart. Set back to true for production.
# ==============================
spring.thymeleaf.cache=false

# ==============================
# File upload / misc
# ==============================
spring.mvc.hiddenmethod.filter.enabled=true

# Where the uploaded mess logo is stored on disk (created automatically).
# Relative to wherever the app is run from.
app.upload.dir=uploads

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
